[project]
name = "avia-api"
version = "0.1.0"
description = "Python API for aviasales.ru"
authors = [
    {name = "Ivan Sladkov",email = "ivan.sladkov@yandex.ru"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pyrate-limiter (>=4.5.0,<5.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "hishel[httpx] (>=1.3.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "avia_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/avia_api"]

[tool.coverage.report]
fail_under = 99
exclude_also = [
    "if t\\.TYPE_CHECKING:",
]
