[project]
name = "avia-api"
version = "0.1.0"
description = "Async Python client for the Travelpayouts / Aviasales Data API"
authors = [
    {name = "Ivan Sladkov",email = "ivan.sladkov@yandex.ru"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pyrate-limiter (>=4.5.0,<5.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "hishel[httpx] (>=1.3.1,<2.0.0)"
]

[project.urls]
Homepage = "https://github.com/sliv2001/avia-api"
Repository = "https://github.com/sliv2001/avia-api"
Issues = "https://github.com/sliv2001/avia-api/issues"
Changelog = "https://github.com/sliv2001/avia-api/blob/master/CHANGELOG.md"

[tool.poetry]
packages = [{include = "avia_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.14.0,<0.15.0)",
    "mypy (>=1.19.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/avia_api"]

[tool.coverage.report]
fail_under = 99
exclude_also = [
    "if t\\.TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/avia_api"]

[[tool.mypy.overrides]]
module = "hishel.*"
ignore_missing_imports = true
